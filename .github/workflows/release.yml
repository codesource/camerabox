name: release

# Push a version tag (e.g. `v0.1.0`) to build the Raspberry Pi binaries and
# publish them as a GitHub Release. The build runs with the repo's built-in
# GITHUB_TOKEN, so it can create the release even when the pusher only has
# git (deploy-key) access.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install cross from git: its images ship a glibc new enough for the
      # runner's host toolchain (the published 0.2.5 images are too old and
      # fail to run the host-side proc-macros).
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build Raspberry Pi targets (static musl)
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local target="$1" label="$2"
            echo "::group::build $label ($target)"
            cross build --release --target "$target"
            cp "target/$target/release/camera-box" "dist/camera-box-$label"
            echo "::endgroup::"
          }
          # Static musl -> no glibc dependency, runs on any Pi OS version.
          build arm-unknown-linux-musleabihf   pi-zero-w-armv6
          build armv7-unknown-linux-musleabihf pi-zero-2w-armv7
          build aarch64-unknown-linux-musl     pi-zero-2w-arm64
          # Luckfox Lyra Zero W (Rockchip RK3506B, triple Cortex-A7) is ARMv7
          # hard-float — the same ISA as the 32-bit Pi Zero 2 W. Publish a
          # board-named copy of that static binary (no extra build needed).
          cp dist/camera-box-pi-zero-2w-armv7 dist/camera-box-luckfox-lyra-zero-w

      - name: Generate checksums
        run: cd dist && sha256sum camera-box-* > SHA256SUMS

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          USB UVC camera appliance daemon for Raspberry Pi.

          ## Downloads (prebuilt, statically linked — no glibc dependency)

          | Board | Asset |
          |-------|-------|
          | Pi Zero W v1.1 (ARMv6) | `camera-box-pi-zero-w-armv6` |
          | Pi Zero 2 W (32-bit OS) | `camera-box-pi-zero-2w-armv7` |
          | Pi Zero 2 W (64-bit OS) | `camera-box-pi-zero-2w-arm64` |
          | Luckfox Lyra Zero W (RK3506B) | `camera-box-luckfox-lyra-zero-w` |

          The Luckfox Lyra Zero W needs a systemd image (the Ubuntu image, not
          Buildroot/BusyBox). Its binary is identical to the Pi Zero 2 W 32-bit one.

          ## Install (Pi Zero W v1.1)

          ```sh
          sudo git clone https://github.com/codesource/camerabox.git /opt/camera-box
          wget https://github.com/codesource/camerabox/releases/latest/download/camera-box-pi-zero-w-armv6 -O /tmp/camera-box
          sudo bash /opt/camera-box/scripts/install.sh /tmp/camera-box
          ```

          Verify downloads against `SHA256SUMS`.
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/camera-box-* dist/SHA256SUMS \
            --title "camera-box ${{ github.ref_name }}" \
            --notes-file release-notes.md
