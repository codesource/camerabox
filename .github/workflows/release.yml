name: release

# Manual-only: releases are normally cut by hand with `gh release create`.
# This workflow is here as an on-demand alternative — trigger it from the
# Actions tab and pass the tag to build. It does NOT run automatically on tags.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must already exist.'
        required: true

permissions:
  contents: write # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      # Install cross from git: its images ship a glibc new enough for the
      # runner's host toolchain (the published 0.2.5 images are too old and
      # fail to run the host-side proc-macros).
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build Raspberry Pi targets (static musl)
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local target="$1" label="$2"
            echo "::group::build $label ($target)"
            cross build --release --target "$target"
            cp "target/$target/release/camera-box" "dist/camera-box-$label"
            echo "::endgroup::"
          }
          # Static musl -> no glibc dependency, runs on any Pi OS version.
          build arm-unknown-linux-musleabihf   pi-zero-w-armv6
          build armv7-unknown-linux-musleabihf pi-zero-2w-armv7
          build aarch64-unknown-linux-musl     pi-zero-2w-arm64

      - name: Generate checksums
        run: cd dist && sha256sum camera-box-* > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.event.inputs.tag }}" dist/* \
            --title "camera-box ${{ github.event.inputs.tag }}" \
            --generate-notes
