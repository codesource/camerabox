# camera-box configuration.
#
# Install to: /etc/camera-box/config.toml
#
# This file is OPTIONAL. If it is missing, or any key is omitted, the built-in
# defaults shown below are used.

# Port of the first camera stream. Each enabled camera takes the next free
# port above this one; there is no fixed limit on how many can stream (the
# practical limit is the number of USB cameras you plug in).
base_stream_port = 8080

# Port for the status web UI and JSON API.
web_port         = 80

# Fallback host for stream/UI links, used ONLY if an HTTP request arrives
# without a Host header (rare). Normally the address you used to reach the
# device is detected automatically, so you usually don't need this.
device_ip        = "192.168.4.1"

# Path to the ustreamer binary.
ustreamer_path   = "/usr/bin/ustreamer"

# Default pre-selected resolution/fps for a newly-seen camera (just the
# dropdown's initial choice). New cameras start OFF; you enable them and pick a
# mode in the web UI. Per-camera choices are then saved to
# /var/lib/camera-box/state.toml and restored on the next boot.
resolution       = "1280x720"
fps              = 30

# Optional hardware factory-reset button on a GPIO line. Wire a momentary button
# between the GPIO and GND; holding it for `reset_hold_secs` wipes all settings
# and reboots (same as Settings -> Factory reset). Empty = disabled.
#   reset_button    = "gpiochip0:17"   # chip:line  (also accepts "0:17")
reset_button     = ""
reset_hold_secs  = 10
# Button pressed = line low (to GND, internal pull-up). false = pressed is high.
reset_active_low = true

# Web UI login: the username/password are NOT in this file. They default to
# admin / password on first run and are changed from the web UI (stored hashed
# in /var/lib/camera-box/auth.toml). Forgot it?  camera-box reset-password
# NOTE: the login does not cover the ustreamer MJPEG streams (ports 8080+),
# which ustreamer serves without auth.
