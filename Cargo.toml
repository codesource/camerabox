[package]
name = "camera-box"
version = "0.3.3"
edition = "2021"
description = "USB UVC camera appliance daemon for Raspberry Pi: detects cameras and exposes low-latency MJPEG streams via ustreamer."
license = "MIT"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
sha2 = "0.10"
# Optional GPIO factory-reset button (kernel GPIO chardev; pure Rust, no C deps).
gpiocdev = "0.7"
anyhow = "1"

# Optimise for a small, fast binary on the Pi Zero (limited flash + RAM).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
